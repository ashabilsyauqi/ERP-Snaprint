version: '3.8'

services:
  app:
    image: laravelsail/php83-composer
    container_name: erp_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
    networks:
      - erp_network

  mysql:
    image: mysql:8.0
    container_name: erp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: erp_snaprint
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - erp_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: erp_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    networks:
      - erp_network

networks:
  erp_network:

volumes:
  db_data:
